<form [formGroup]="resetForm" (ngSubmit)="onSendReset()">
  @if (emailSent()) {
    <p role="status">
      If that email has an account, a reset link is on its way. Check your inbox (and spam). The
      link works for 1 hour.
    </p>
  } @else {
    <label for="email">Email: </label>
    <input
      id="email"
      type="email"
      placeholder="Enter Email"
      formControlName="email"
      autocomplete="email"
    />
    <button matButton="filled" type="submit" [disabled]="resetForm.invalid">Send reset link</button>
    @if (errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
    }
  }
  <a class="form-link" [routerLink]="['/', routes.login]">Back to log in</a>
</form>
