<section class="club-area">
  <header class="welcome">
    <h2>Club Area</h2>
    <p>Hello {{ greetingName() }}</p>
  </header>

  <div class="cards">
    @for (link of links; track link.route) {
      <app-club-area-card [link]="link" />
    }
  </div>

  <button matButton="outlined" class="log-out" (click)="logOut()">Log out</button>
</section>
