<header class="hero">
  <!-- The browser picks the smallest file that fills the screen: 800w on phones, 1920w on tablets and laptops -->
  <img
    class="hero-image"
    src="images/hero-air-pistol-800.webp"
    srcset="images/hero-air-pistol-800.webp 800w, images/hero-air-pistol-1920.webp 1920w"
    sizes="100vw"
    width="1920"
    height="1121"
    alt=""
    fetchpriority="high"
  />

  <img class="hero-logo" src="images/logo.svg" alt="Glenrothes Target Shooting Club badge" />

  <div class="hero-content">
    <h1 class="hero-title">Glenrothes Target Shooting Club</h1>
  </div>
</header>
